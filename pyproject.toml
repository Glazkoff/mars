[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-coverage"
version = "0.1.0"
description = "MARS: fact-level coverage (MARS-R) and faithfulness (MARS-P) scoring with candidate-blind controls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.49"]
test = ["pytest>=8"]

[project.scripts]
mars = "mars.cli:main"

[tool.setuptools]
packages = ["mars"]
